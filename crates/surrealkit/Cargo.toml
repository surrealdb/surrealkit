[package]
name = 'surrealkit'
description = 'Manage migrations, seeding, typegen and tests for SurrealDB via CLI'
readme = 'README.md'
documentation = 'https://docs.rs/surrealkit'
keywords = ['surrealdb', 'migrations', 'seed', 'testing', 'manage']
categories = ['database', 'command-line-utilities', 'development-tools']
# Test-only data: the typegen golden corpus and insta snapshots stay in the repository and
# out of the published crate. The tests that read them run from a checkout.
exclude = ['tests/fixtures/typegen_corpus/**', 'tests/snapshots/**', 'src/**/snapshots/**']
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
surrealkit-macros = { workspace = true }
anyhow = { workspace = true }
clap = { version = '4.5.47', features = ['derive', 'env', 'wrap_help'], optional = true }
hex = '0.4'
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = '0.8'
toml_edit = '0.22'
rust_dotenv = '0.1.2'
sha2 = '0.10'
surrealdb = { workspace = true }
surrealdb-types = { workspace = true }
time = { version = '0.3', features = ['macros', 'formatting'] }
tokio = { version = '1.47', features = ['macros', 'rt-multi-thread', 'signal', 'sync', 'time'] }
walkdir = { workspace = true }
reqwest = { version = '0.12', default-features = false, features = ['json', 'rustls-tls'] }
regex = '1'
rustls = { version = '0.23', default-features = false, features = ['aws-lc-rs'], optional = true }
inquire = { version = '0.7', optional = true }
tempfile = { version = '3', optional = true }
indoc = "2"
# Host-code query extraction (`host_queries`): finds `db.query("…")` calls in
# TypeScript, Svelte, Vue and Astro sources with the TypeScript grammar.
tree-sitter = { version = '0.26', optional = true }
tree-sitter-typescript = { version = '0.23', optional = true }
# Model Context Protocol server. `server` brings ServerHandler and schemars (which
# rmcp re-exports, so we take no direct schemars dependency and cannot skew
# versions with it); `transport-io` is stdio. `default-features = false` drops
# `base64`, which nothing here uses.
rmcp = { version = '1.7.0', default-features = false, features = ['server', 'macros', 'transport-io'], optional = true }
# `surrealkit watch`: file-change events. Only the macOS FSEvents backend is named; Linux
# (inotify) and the BSDs need no feature.
notify = { version = '8', optional = true, default-features = false, features = ['macos_fsevent'] }

[features]
# The published CLI binary bundles only the in-memory engine, keeping the
# prebuilt artifact light. Remote connections (protocol-http/jwks) are always
# available. Build the CLI with --features kv-surrealkv (or `embedded`) for an
# embedded build.
#
# Library consumers do NOT need these features to target an embedded engine:
# Cargo unifies features across the dependency graph, so enabling e.g.
# `surrealdb/kv-surrealkv` in your own crate is enough for SurrealKit's
# `Surreal<Any>` to open `surrealkv://`.
default = ['kv-mem', 'cli', 'analyze']
# The `surrealkit` binary. On by default so `cargo install surrealkit` works, but
# `default-features = false` drops clap, inquire, rustls (and its aws-lc-rs
# backend) and tempfile from a library consumer's dependency tree -- none of them
# are used by the library itself.
cli = ['templates', 'host-queries', 'dep:clap', 'dep:inquire', 'dep:rustls']
# Extraction of the queries host-language sources send (`host_queries`), which
# `check` lints and `generate` types. The CLI enables it; a library consumer that
# reads no host code does not need the grammars.
host-queries = ['dep:tree-sitter', 'dep:tree-sitter-typescript']
# `surrealkit init`'s template engine. Shared by the CLI and the MCP server, so it
# lives in the library rather than the binary. Interactive feature selection needs
# `inquire` and is compiled only under `cli`; every other consumer is
# non-interactive, which is what a server needs.
templates = ['dep:tempfile']
# The `surrealkit mcp` MCP server, over stdio. Deliberately does NOT imply `cli`:
# a library consumer can embed the server without pulling in clap/inquire/rustls.
# (A stateless streamable-HTTP transport is deferred until its auth story is
# designed -- in stateless mode MCP requires no handshake, so an unauthenticated
# port would expose arbitrary SurrealQL execution.)
mcp = ['templates', 'dep:rmcp']
# `surrealkit check` and `surrealkit watch` (and `surrealkit::check`): static checks of a
# project's SurrealQL, against an in-memory engine and with no database. It needs the
# in-memory engine and does NOT imply `cli`, so a library consumer can run a check without
# clap. `[analyze]` in surrealkit.toml parses whether or not this feature is on, so one
# config file serves every build.
analyze = ['kv-mem', 'dep:notify']
kv-mem = ['surrealdb/kv-mem']
kv-surrealkv = ['surrealdb/kv-surrealkv']
# Convenience: a full embedded CLI with every supported local engine.
embedded = ['kv-surrealkv', 'kv-mem']

[[bin]]
name = 'surrealkit'
path = 'src/main.rs'
required-features = ['cli']

[dev-dependencies]
tempfile = '3'
test-case = '3'
insta = { version = '1', features = ['json'] }
# An in-process MCP client, so the protocol tests drive the real server over an
# in-memory duplex rather than a socket. `client` is deliberately a dev-only
# feature: the shipped server has no need of it.
rmcp = { version = '1.7.0', default-features = false, features = ['client', 'server', 'macros', 'transport-io', 'transport-async-rw'] }

# The MCP tests need the server compiled in. Without `required-features` they
# would break `cargo test --no-default-features --features cli`.
[[test]]
name = 'mcp_contract'
path = 'tests/mcp_contract.rs'
required-features = ['mcp']

[[test]]
name = 'mcp_protocol'
path = 'tests/mcp_protocol.rs'
required-features = ['mcp', 'cli']

[[test]]
name = 'mcp_stdout_purity'
path = 'tests/mcp_stdout_purity.rs'
required-features = ['mcp', 'cli']

[[test]]
name = 'check_cli'
path = 'tests/check_cli.rs'
required-features = ['analyze', 'cli']

[lints]
workspace = true

# Enable installation of prebuilt release binaries via `cargo binstall surrealkit`.
# Archives published by .github/workflows/release-binaries.yml are named
#   surrealkit-vX.Y.Z-<target>.(tar.gz|zip)
# and contain the binary at the archive root (no `{name}-{target}/` subfolder),
# so we override `bin-dir` to skip binstall's default prefix.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
