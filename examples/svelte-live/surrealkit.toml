# SurrealKit for this example. `npm run types` regenerates the typed-query
# module once the engine types queries (SurrealDB 4.1); until then the module
# in src/lib/generated is written by hand in the same shape.

[typegen]
schema_version = 2

[typegen.queries]
sources = ["src"]
typescript = "src/lib/generated/queries.ts"
# Registers the module with the bindings, so no hand-written augmentation is needed.
register = "surrealkit-query"
