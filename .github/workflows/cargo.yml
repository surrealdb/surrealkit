name: CI

on:
    push:
        branches:
            - "**"
        tags:
            - "v*"
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        name: Lint, test, and publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
              with:
                  toolchain: 1.94.0
                  components: clippy, rustfmt

            # `-D warnings` makes the [workspace.lints.clippy] table in the root
            # Cargo.toml actually enforceable; --all-targets extends it to test code.
            # `unwrap()`/`expect()` remain allowed in tests via clippy.toml.
            - name: Lint
              run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

            # The library must keep building without the `cli` feature, which is what
            # lets a library consumer drop clap/inquire/rustls from their tree.
            - name: Lint (library only)
              run: cargo clippy -p surrealkit --lib --no-default-features --features kv-mem --locked -- -D warnings

            # Broken intra-doc links render as plain text on docs.rs, so fail on them.
            - name: Docs
              run: cargo doc --workspace --no-deps --all-features --locked
              env:
                  RUSTDOCFLAGS: -D warnings

            - name: Format
              run: cargo fmt --all --check

            - name: Test workspace
              run: cargo test --workspace --all-features --locked

            # Catches packaging breaks on PRs instead of at tag time, when a partial
            # release has already happened (see 8b83dd8, where templates were missing
            # from the published crate).
            #
            # surrealkit itself cannot use `publish --dry-run`: it depends on
            # surrealkit-macros by exact version, which is not on crates.io until the
            # release tag publishes it. `package --list` needs no registry resolution
            # and verifies the thing that actually broke -- the file manifest.
            - name: Package dry-run (macros)
              run: cargo publish --dry-run --manifest-path crates/surrealkit-macros/Cargo.toml --locked

            - name: Package contents (surrealkit)
              run: |
                  set -euo pipefail
                  files="$(cargo package --list --manifest-path crates/surrealkit/Cargo.toml --allow-dirty)"
                  # build.rs bakes templates/ into the binary; without them `init` is broken.
                  echo "$files" | grep -qx 'build.rs' || { echo '::error::build.rs missing from package'; exit 1; }
                  count="$(echo "$files" | grep -c '^templates/' || true)"
                  if [ "$count" -lt 20 ]; then
                      echo "::error::only $count templates/ files in package (expected >= 20)"
                      exit 1
                  fi
                  echo "packaged $count template files"

            # Publishes are idempotent: a version already on crates.io is
            # skipped (not an error), so a partially-failed release can be
            # safely re-run. Any other publish failure still fails the job.
            - name: Publish surrealkit-macros
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  if cargo publish --manifest-path crates/surrealkit-macros/Cargo.toml --locked 2>publish.err; then
                      cat publish.err
                  elif grep -qi "already \(exists\|uploaded\)" publish.err; then
                      cat publish.err
                      echo "surrealkit-macros version already on crates.io; skipping."
                  else
                      cat publish.err
                      exit 1
                  fi
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

            - name: Publish surrealkit
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  if cargo publish --manifest-path crates/surrealkit/Cargo.toml --locked 2>publish.err; then
                      cat publish.err
                  elif grep -qi "already \(exists\|uploaded\)" publish.err; then
                      cat publish.err
                      echo "surrealkit version already on crates.io; skipping."
                  else
                      cat publish.err
                      exit 1
                  fi
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
