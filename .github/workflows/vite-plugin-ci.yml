name: Vite plugin CI

# The plugin previously had no CI at all: publish-vite-plugin.yml runs only on a
# `vite-plugin-v*` tag, so a broken build was only discovered at publish time.
# Branches are tested through their pull request; pushes run only on main.
on:
    push:
        branches:
            - main
        paths: &vite_paths
            - "packages/vite-plugin-surrealkit/**"
            # The `surql` option loads effect-surrealkit's mapper.
            - "packages/effect-surrealkit/src/**"
            - "packages/effect-surrealkit/package.json"
            - ".github/workflows/vite-plugin-ci.yml"
    pull_request:
        paths: *vite_paths
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: Lint, typecheck, test and build (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The floor declared in `engines`, plus current.
                node: ["22.15", "24"]
        defaults:
            run:
                working-directory: packages/vite-plugin-surrealkit

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
              with:
                  node-version: ${{ matrix.node }}

            # The `surql` option's tests link the sibling package's build into
            # node_modules (it is no dependency of the plugin), so it is built
            # first, and SURQL_TESTS=required below makes them fail without it.
            - name: Build effect-surrealkit
              working-directory: packages/effect-surrealkit
              run: |
                  npm install
                  npm run build

            # NOTE: the package commits a bun.lock but no package-lock.json, so
            # `npm ci` is impossible and installs here are unpinned. Matches what
            # publish-vite-plugin.yml already does; converging on one package
            # manager is tracked separately.
            - name: Install dependencies
              run: npm install

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            # These boot real Vite dev servers and a filesystem watcher; they
            # are what catches a Vite release breaking schema watching.
            - name: Test
              env:
                  SURQL_TESTS: required
              run: npm test

            - name: Build
              run: npm run build
